name: Deploy TWIS Showcase

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out static showcase
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Stage only public showcase assets
        shell: bash
        run: |
          mkdir -p _site
          cp index.html showcase.css showcase.js showcase-icon.svg .nojekyll _site/
      - name: Upload public showcase artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy public showcase
        id: deployment
        uses: actions/deploy-pages@v5
